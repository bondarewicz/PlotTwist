services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: plottwist-pg
    # Parallel HNSW index builds use shared memory; Docker's default 64 MB /dev/shm is too small.
    shm_size: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plottwist
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plottwist"]
      interval: 2s
      retries: 15

# Ollama runs natively, not in Docker: on macOS a container can't use the GPU (Metal), so embedding is much slower.

volumes:
  pgdata:
